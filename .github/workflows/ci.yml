name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

# A force-push or a second commit makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the version the project is developed against and the pinned
  # `@types/bun`; CI should not silently move ahead of either.
  BUN_VERSION: 1.3.14

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          skip='^(README\.md|CONTRIBUTING\.md|AGENTS\.md|CLAUDE\.md|vercel\.json|docs/.*|\.claude/.*|\.junie/.*)$'
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo code=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...HEAD" | grep -qEv "$skip"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # The release on `main` picks its version and writes its notes from commit
  # messages, so a commit that is not a Conventional Commit is left out of
  # both without a word. Merge commits and GitHub's `Revert "…"` are allowed.
  commits:
    name: conventional commits
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+|Revert ".+")'
          bad=$(git log --no-merges --format='%h %s' "$BASE..$HEAD" | grep -vE "^[0-9a-f]+ $pattern$" || true)
          if [ -n "$bad" ]; then
            echo "::error::These commits are not Conventional Commits (type(scope): description), see CONTRIBUTING.md:"
            echo "$bad"
            exit 1
          fi

  # Everything that needs no browser, so a broken type or a failing unit test
  # is red in well under a minute rather than behind a Chromium download and
  # a production build.
  checks:
    name: typecheck, lint, unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      - run: bun run format

      - run: bun run test

      # The README's health badge is a committed SVG, so it can go stale
      # silently — unless something notices. This is that something.
      # When it fails: `bun run badge`, and commit the result.
      - run: bun run check:badge

      - run: bun run check:vectors

      - run: bun run check:vectors:development
        continue-on-error: true

  e2e:
    name: end-to-end
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Downloading and diffing real archives from five registries is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # The engine arrives prebuilt from npm (`@philfreshman/diffpack-engine`), so
      # this is the whole of it: no Rust toolchain, no wasm-pack, no cargo
      # cache. What that buys in minutes it costs in coupling — a change to
      # philfreshman/diffpack-engine is not proved against the app until its
      # version is bumped here, which is what makes the Renovate PR for that
      # bump the run to read rather than rubber-stamp.
      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # `test:e2e` builds and serves the app itself — see the `webServer` block
      # in playwright.config.ts. It is a production build, not `vite dev`.
      - run: bun run test:e2e

      - run: bun run test:networked

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # PR-scoped fallow gate: only findings the PR itself introduces can fail
  # this job (Decision 2 on #111 — `--gate new-only`, the fallow default).
  # A legacy backlog on files the PR does not touch does not block it; that
  # drift is caught separately by fallow-full below.
  fallow-audit:
    name: fallow audit (PR gate)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          # `audit` diffs against the PR base, which needs history beyond the
          # single commit a shallow checkout gives it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # `fail-on-empty-analysis`: a run that analysed no source file reports
      # zero of everything and passes, which reads exactly like a clean tree.
      # It fails instead, so a broken root or an ignore pattern that swallows
      # `src/` cannot pass unnoticed. A PR that changes no source file does not
      # trip it: the audit still analyses the project.
      - uses: fallow-rs/fallow@v3
        with:
          command: audit
          gate: new-only
          fail-on-empty-analysis: true

      # Phase 7 on #111. `fallow security` is an opt-in surface: its findings
      # never appear under bare `fallow` or in the audit gate above, so without
      # this step a PR could add a new `dangerouslySetInnerHTML` or a new
      # unconstrained fetch and nothing would say so.
      #
      # `--gate newly-reachable`, not `--gate new`. Both fail only on something
      # the PR brings; the difference is what counts as new. `new` fires on any
      # candidate appearing on a changed line, which includes an existing sink
      # whose *ranking* moved — and that is not hypothetical. Adding
      # `tests/unit/registries/outboundOrigins.test.ts`, whose entire purpose is
      # to prove the two `http.ts` SSRF sinks safe, raised them from `low` to
      # `medium`: fallow's taint model reads a spec full of hostile-looking URLs
      # as a module receiving untrusted input and traces it two import hops into
      # the sink. `--gate new` went red on the file that closed the finding.
      #
      # `newly-reachable` asks the question that survives that: did a candidate
      # become runtime-reachable from an entry point in head that was not
      # reachable in base? A genuinely new sink does — verified with a probe
      # `dangerouslySetInnerHTML` in `NotFound.tsx`, which fails this step — and
      # a re-ranked existing one does not.
      #
      # The standing eight are triaged in `docs/security-candidates.md` and
      # deliberately do not block; fallow has no `--gate all` here, on the
      # grounds that gating a whole backlog is how a gate gets ignored. When
      # this step fails, either fix the sink or add a row to that file.
      #
      # The base SHA rather than `origin/<base_ref>`: `fetch-depth: 0` above
      # guarantees the commit is in history, which is all `--changed-since`
      # needs, and it does not depend on how checkout arranged its remote refs.
      - name: fallow security (newly reachable candidates)
        run: >
          bunx fallow security
          --gate newly-reachable
          --changed-since ${{ github.event.pull_request.base.sha }}

      # Every module in `src/lib` gets a unit test (CLAUDE.md), and this holds
      # it: a file or export there that no unit test imports fails the step and
      # is listed in the run summary. Only `src/lib`, because Playwright covers
      # the components without importing them, which fallow cannot see. For the
      # same reason the `coverage-gaps` rule stays off: at `error` it would gate
      # the whole tree. A file no unit test can run takes a reasoned
      # `fallow-ignore-file coverage-gaps` instead.
      - name: fallow coverage gaps (src/lib)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bun run --silent check:coverage-gaps | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: fallow-rs/fallow@v3
        if: ${{ !cancelled() }}
        with:
          format: sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: fallow-results.sarif

  # Full-repo run on `development`, separate from the PR gate above.
  # `--gate new-only` by design never looks at files a PR does not touch, so
  # this is what catches drift that lands any other way (a direct push, a
  # merge from a branch that skipped its own gate, config changes).
  fallow-full:
    name: fallow (full repo)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # `fail-on-empty-analysis`: see the PR gate above.
      - uses: fallow-rs/fallow@v3
        with:
          fail-on-empty-analysis: true

      # Phase 7 on #111: the optional TypeScript semantic pass, here and
      # nowhere else. It is what settles a dead-code candidate that the
      # syntactic pass can only guess at — whether an export really has no
      # consumers — so it has work to do exactly when the tree is not clean;
      # on a clean tree it reports `executed: false` and costs nothing.
      #
      # CI only, never the pre-commit hook: the hook's whole argument is that
      # it stays under about five seconds, and this is a second TypeScript
      # program load. `best-effort` (set in `.fallowrc.jsonc`) keeps an
      # incomplete semantic answer advisory rather than failing the job — the
      # companion is an optional dependency of `fallow`, and a runner that
      # resolves it differently should not turn CI red.
      #
      # `_meta.type_aware` goes to the job summary because "inspect the meta
      # block" is otherwise a thing nobody does. It says whether the pass ran,
      # what it adjudicated, and why it abstained where it did.
      - name: fallow dead-code (type-aware)
        run: |
          # The summary is written either way: a red step is the most
          # interesting time to be able to read why the pass abstained.
          set +e
          bunx fallow dead-code --type-aware --format json --quiet > type-aware.json
          status=$?
          set -e
          {
            echo '## fallow type-aware'
            echo '```json'
            jq '._meta.type_aware' type-aware.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # See `fallow coverage gaps (src/lib)` in the PR gate above.
      - name: fallow coverage gaps (src/lib)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bun run --silent check:coverage-gaps | tee -a "$GITHUB_STEP_SUMMARY"

      # The same grade the README badge carries, rendered on the run page with
      # the per-threshold detail behind it. The badge is the number; this is
      # why the number is what it is.
      - name: Publish the health grade
        if: ${{ !cancelled() }}
        run: bunx fallow health --format github-summary >> "$GITHUB_STEP_SUMMARY"

      - uses: fallow-rs/fallow@v3
        if: ${{ !cancelled() }}
        with:
          format: sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: fallow-results.sarif
